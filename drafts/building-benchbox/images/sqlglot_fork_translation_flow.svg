<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="608" viewBox="0 0 1250 608">
<defs>
<style>
@font-face{font-family:"Martian Mono";src:local("Martian Mono") format("woff2");font-weight:400;font-stretch:75% 112.5%}
@font-face{font-family:"Instrument Sans";src:local("Instrument Sans") format("woff2");font-weight:400 700}
.h{font-family:"Martian Mono",monospace;font-stretch:87.5%;fill:#5c1a2e}
.t{font-family:"Instrument Sans",sans-serif;fill:#4b2c3a}
.m{font-family:"Instrument Sans",sans-serif;fill:#7d4656}
.mono{font-family:"Martian Mono",monospace;font-stretch:87.5%;fill:#4b2c3a}
.box{fill:#f2e1d4;stroke:#d7bca8;stroke-width:1.5}
.core{fill:#5c1a2e;stroke:#5c1a2e}
.chip{fill:#f9f0e7;stroke:#d7bca8;stroke-width:1.2}
.pill{fill:#a7c6ed}
.arrow{stroke:#5c1a2e;stroke-width:2.5;fill:none;marker-end:url(#ah)}
.arrow2{stroke:#7d4656;stroke-width:1.8;fill:none;marker-end:url(#ah2);stroke-dasharray:6 5}
</style>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c1a2e"/></marker>
<marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d4656"/></marker>
</defs>
<rect width="1250" height="608" fill="#f9f0e7"/>

<!-- title -->
<text x="48" y="56" class="h" font-size="24">One translator in every install</text>
<text x="48" y="82" class="m" font-size="15">How BenchBox v0.5.0 turns one benchmark definition into SQL for 49 platforms, and how we know the SQL is right</text>

<!-- upstream -->
<g transform="translate(455,108)">
<rect class="box" x="0" y="0" width="340" height="54" rx="8"/>
<text x="170" y="22" class="h" font-size="14" text-anchor="middle">tobymao/sqlglot</text>
<text x="170" y="42" class="m" font-size="13" text-anchor="middle">upstream, v30.29.0 (155 commits since v30.24.0)</text>
</g>
<path class="arrow2" d="M560,162 L560,208"/>
<text x="548" y="190" class="m" font-size="12" text-anchor="end">releases merged in</text>
<path class="arrow2" d="M690,208 L690,162"/>
<text x="702" y="190" class="m" font-size="12">general fixes offered back</text>

<!-- left: benchmark SQL -->
<g transform="translate(48,230)">
<rect class="box" x="0" y="0" width="250" height="150" rx="10"/>
<text x="20" y="32" class="h" font-size="15">Benchmark SQL</text>
<text x="20" y="54" class="t" font-size="13">written once, in one dialect</text>
<text x="20" y="84" class="mono" font-size="12">TPC-H    22 queries</text>
<text x="20" y="104" class="mono" font-size="12">TPC-DS   99 queries</text>
<text x="20" y="124" class="mono" font-size="12">+ DDL, OBT, Primitives ...</text>
</g>
<path class="arrow" d="M298,305 L350,305"/>

<!-- center: BenchBox + fork -->
<g transform="translate(352,208)">
<rect class="box" x="0" y="0" width="546" height="194" rx="12"/>
<text x="20" y="30" class="h" font-size="15">BenchBox</text>
<text x="110" y="30" class="m" font-size="12.5">entry points: translate query, named rewrites, translate DDL, load runtime</text>
<rect class="core" x="20" y="48" width="506" height="126" rx="10"/>
<text x="40" y="78" class="h" font-size="16" fill="#f9f0e7" style="fill:#f9f0e7">benchbox-sqlglot 30.29.0.1</text>
<text x="40" y="100" font-size="13" font-family="Instrument Sans" fill="#f2e1d4">shipped inside the benchbox wheel, MIT license, no separate install</text>
<g transform="translate(40,118)">
<rect class="pill" x="0" y="0" width="150" height="34" rx="17"/>
<text x="75" y="22" class="mono" font-size="12" text-anchor="middle">SQLGlot v30.29.0</text>
<rect class="pill" x="162" y="0" width="150" height="34" rx="17"/>
<text x="237" y="22" class="mono" font-size="12" text-anchor="middle">24 carried patches</text>
<rect class="pill" x="324" y="0" width="150" height="34" rx="17"/>
<text x="399" y="22" class="mono" font-size="12" text-anchor="middle">5 added dialects</text>
</g>
</g>
<path class="arrow" d="M898,305 L950,305"/>

<!-- right: engines -->
<g transform="translate(952,230)">
<rect class="box" x="0" y="0" width="250" height="150" rx="10"/>
<text x="20" y="32" class="h" font-size="15">Translated SQL</text>
<text x="20" y="54" class="t" font-size="13">one declared dialect per platform</text>
<g transform="translate(20,70)" font-size="11.5">
<rect class="chip" x="0" y="0" width="64" height="24" rx="6"/><text class="mono" x="32" y="16" text-anchor="middle">SQLite</text>
<rect class="chip" x="72" y="0" width="68" height="24" rx="6"/><text class="mono" x="106" y="16" text-anchor="middle">DuckDB</text>
<rect class="chip" x="148" y="0" width="62" height="24" rx="6"/><text class="mono" x="179" y="16" text-anchor="middle">Spark</text>
<rect class="chip" x="0" y="31" width="90" height="24" rx="6"/><text class="mono" x="45" y="47" text-anchor="middle">DataFusion</text>
<rect class="chip" x="98" y="31" width="92" height="24" rx="6"/><text class="mono" x="144" y="47" text-anchor="middle">ClickHouse</text>
<text class="m" x="0" y="74" font-size="12">+ 44 more SQL platforms</text>
</g>
</g>

<!-- bottom: proof -->
<g transform="translate(48,430)">
<rect class="box" x="0" y="0" width="1154" height="136" rx="12"/>
<text x="20" y="30" class="h" font-size="15">Proven by running it, not by reading it</text>
<g transform="translate(20,48)">
<rect class="chip" x="0" y="0" width="548" height="70" rx="8"/>
<text x="16" y="24" class="t" font-size="13" font-weight="600">Fork CI: ten real engines</text>
<text x="16" y="42" class="mono" font-size="11">in-process: SQLite, DuckDB, DataFusion, chDB, Spark</text><text x="16" y="58" class="mono" font-size="11">containers pinned by digest: PostgreSQL, Trino, QuestDB, StarRocks, Doris</text>
<rect class="chip" x="566" y="0" width="548" height="70" rx="8"/>
<text x="582" y="24" class="t" font-size="13" font-weight="600">BenchBox CI: every TPC-H and TPC-DS query, rows compared</text>
<text x="582" y="42" class="mono" font-size="11">22 TPC-H + 99 TPC-DS queries at SF 0.01</text><text x="582" y="58" class="mono" font-size="11">on SQLite, DuckDB, DataFusion and PostgreSQL; every difference explained</text>
</g>
</g>

<text x="1202" y="592" class="m" font-size="11" text-anchor="end">benchbox.dev</text>
</svg>
