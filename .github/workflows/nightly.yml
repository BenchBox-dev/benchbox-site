name: Nightly

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run audit:high -w explorer
      - run: npm run audit:high -w website

  links:
    name: external links
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Check external links in published content
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          args: --config .lychee.toml --no-progress --max-concurrency 8 --scheme https --scheme http --exclude-loopback "blog/**/*.md" "docs/**/*.md" "website/src/**/*.astro"
          output: lychee-report.md
          fail: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
      - name: Check published documentation routes and fragments
        id: published
        if: vars.SITE_ORIGIN != ''
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          set +e
          curl -fsS "$SITE_ORIGIN/sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed -e 's/<[^>]*>//g' -e 's#^https\{0,1\}://[^/]*##' | grep '^/docs/' | sed "s#^#$SITE_ORIGIN#" > published-docs.txt
          if [ ! -s published-docs.txt ]; then
            echo "The sitemap lists no documentation pages." > published-report.md
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          origin_pattern="^$(printf '%s' "$SITE_ORIGIN" | sed 's/\./\\./g')"
          rm -rf published-batches && mkdir published-batches
          split -l 100 -d -a 3 published-docs.txt published-batches/pages-
          for batch in published-batches/pages-*; do
            mapfile -t pages < "$batch"
            status=1
            for attempt in 1 2 3; do
              lychee --config .lychee.toml --no-progress --max-concurrency 4 --include-fragments --include "$origin_pattern" --scheme https --cache --format json --output "$batch.json" "${pages[@]}"
              status=$?
              if [ "$status" -eq 0 ] || [ "$status" -eq 2 ]; then
                break
              fi
              sleep 15
            done
            if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
              printf 'lychee exited with status %s after 3 attempts on %s.\n' "$status" "$batch" > published-report.md
              echo "failed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          if node scripts/check-published-links.mjs inventory/known-broken-links.json published-batches/*.json > published-report.md; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open or update the broken-links issue
        if: steps.lychee.outputs.exit_code != '0' || steps.published.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXTERNAL_EXIT: ${{ steps.lychee.outputs.exit_code }}
          PUBLISHED_FAILED: ${{ steps.published.outputs.failed }}
        run: |
          set -euo pipefail
          NUMBER="$(gh issue list --repo "$REPO" --label broken-links --state open --json number --jq '.[0].number // empty')"
          {
            printf 'Link check found broken links.\n\nRun: %s\n\n' "$RUN_URL"
            if [ "$EXTERNAL_EXIT" != "0" ]; then
              printf '## External links in the sources\n\n'
              head -c 30000 lychee-report.md
              printf '\n\n'
            fi
            if [ "$PUBLISHED_FAILED" = "true" ]; then
              printf '## Published documentation\n\n'
              head -c 30000 published-report.md
            fi
          } > issue-body.md
          BODY="$(cat issue-body.md)"
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --repo "$REPO" --body "$BODY"
          else
            gh label create broken-links --repo "$REPO" --color D93F0B --description "The nightly link check failed" --force
            gh issue create --repo "$REPO" --title "Broken links" --label broken-links --body "$BODY"
          fi

  contract-drift:
    name: explorer contract drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - name: Compare the Explorer pin with the newest certified bundle
        id: drift
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          node scripts/check-contract-drift.mjs 2>&1 | tee drift.txt
      - name: Open or update the contract-drift issue
        if: failure() && steps.drift.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          NUMBER="$(gh issue list --repo "$REPO" --label contract-drift --state open --json number --jq '.[0].number // empty')"
          BODY="$(printf 'The nightly Explorer contract drift check failed.\n\nRun: %s\n\n```\n' "$RUN_URL"; cat drift.txt; printf '```\n')"
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --repo "$REPO" --body "$BODY"
          else
            gh label create contract-drift --repo "$REPO" --color D93F0B --description "The nightly Explorer contract drift check failed" --force
            gh issue create --repo "$REPO" --title "Explorer contract drift" --label contract-drift --body "$BODY"
          fi

  availability:
    name: availability probe
    if: vars.SITE_DEPLOY_TARGET != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
      - name: Probe every route class
        id: probe
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
        run: |
          set -o pipefail
          node scripts/probe-routes.mjs "$SITE_ORIGIN" | tee probe.txt
      - name: Open or update the availability issue
        if: failure() && steps.probe.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          NUMBER="$(gh issue list --repo "$REPO" --label site-unavailable --state open --json number --jq '.[0].number // empty')"
          BODY="$(printf 'The nightly availability probe failed.\n\nRun: %s\n\n```\n' "$RUN_URL"; cat probe.txt; printf '```\n')"
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --repo "$REPO" --body "$BODY"
          else
            gh label create site-unavailable --repo "$REPO" --color B60205 --description "The nightly availability probe failed" --force
            gh issue create --repo "$REPO" --title "Site availability probe failed" --label site-unavailable --body "$BODY"
          fi
